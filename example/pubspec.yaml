name: mvvm_lite_example
description: Demo app for the mvvm_lite package — a counter with an async action.
publish_to: "none"
version: 1.0.0

# Tracks the newest stable; the package floor is far lower — see ../pubspec.yaml.
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  mvvm_lite:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
