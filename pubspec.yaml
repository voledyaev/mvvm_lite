name: mvvm_lite
description: A tiny, zero-dependency MVVM toolkit for Flutter — ViewModel base class with lifecycle tracking, scoped provider, granular ViewModelSelector, and ViewModelBuilder.
version: 1.0.0
repository: https://github.com/voledyaev/mvvm_lite
issue_tracker: https://github.com/voledyaev/mvvm_lite/issues
homepage: https://github.com/voledyaev/mvvm_lite

topics:
  - mvvm
  - state-management
  - view-model
  - architecture

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
